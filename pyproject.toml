# ABOUTME: Project config for the black-box HTTP conformance suite that pins guard-proxy's behavior.
# ABOUTME: The suite runs any implementation as a subprocess; proxy.py itself stays dependency-free.
[project]
name = "guard-proxy-conformance"
version = "0.1.0"
description = "Black-box conformance suite for guard-proxy (reference: proxy.py)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["conformance"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["proxy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "RUF", "PLW"]
# `ruff format` owns line length for code; E501 would only flag exact-string assertions and prose.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "fakes"]
