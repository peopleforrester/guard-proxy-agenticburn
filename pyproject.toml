# ABOUTME: Project config for the black-box HTTP conformance suite that pins guard-proxy's behavior.
# ABOUTME: The suite runs any implementation as a subprocess; proxy.py itself stays dependency-free.
[project]
name = "guard-proxy-conformance"
version = "0.1.0"
description = "Black-box conformance suite for guard-proxy (reference: proxy.py)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-urllib==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "pytest>=9.1",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["conformance"]
addopts = "-q --strict-markers"
# Milestone subsets, kept for selecting one area. Both implementations run the whole suite.
markers = [
    "passthrough: forwarding to the agent with every guard off, plus /guards and upstream failures (PRD #412 M1)",
    "guards: the input and output guards and their fail-closed policy on the A2A path (PRD #412 M2)",
    "spans: the OpenTelemetry spans, cost gauge and log correlation, read from a fake OTLP collector (PRD #412 M5)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["proxy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "RUF", "PLW"]
# `ruff format` owns line length for code; E501 would only flag exact-string assertions and prose.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "fakes", "otlp"]
