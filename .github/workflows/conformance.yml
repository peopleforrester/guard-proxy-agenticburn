# ABOUTME: Runs the conformance suite against proxy.py, and the Go build's tests plus the suite less its
# ABOUTME: span tests, on every push and pull request. Actions are pinned by commit SHA (see each line).
name: conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, as of 2026-10-11
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0, as of 2026-10-11
      - run: uv sync --locked
      - run: uv run ruff check conformance
      - run: uv run pytest
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, as of 2026-10-11
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, as of 2026-10-14
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0, as of 2026-10-11
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-clean:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/guard-proxy ./cmd/guard-proxy
      - run: uv sync --locked
      - name: conformance suite against the Go build, less the spans (M5)
        run: GUARD_PROXY_CMD="$PWD/bin/guard-proxy --listen 127.0.0.1:{port}" uv run pytest -m "not spans"
